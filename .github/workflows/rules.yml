name: rules

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commits and added lines
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base=$PR_BASE; head=$PR_HEAD
          else
            base=$BEFORE; head=$AFTER
            if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base=$(git rev-parse "$head~1")
            fi
          fi
          sh .githooks/check-rules.sh range "$base" "$head"

      - name: PR title and description
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title"
          printf '%s\n' "$BODY" > "$RUNNER_TEMP/body"
          sh .githooks/check-rules.sh msg "$RUNNER_TEMP/title"
          sh .githooks/check-rules.sh text "$RUNNER_TEMP/body"
